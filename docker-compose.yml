services:

  # ── MySQL test database ───────────────────────────────────────────────────────
  # Used by the WordPress test suite (PHPUnit). The bootstrap hook installs
  # the WP test library once; the pre-issue hook drops and recreates tables
  # before each issue so tests always start from a clean state.
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-uroot", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Loop engineer worker ──────────────────────────────────────────────────────
  # Scheduling model: the worker processes one issue per run, then exits.
  #   - When work is found: runs immediately, exits 0, Docker restarts it.
  #   - When idle: sleeps IDLE_SLEEP seconds (default 15 min), exits, Docker
  #     restarts it. This gives a ~15-minute polling interval with no extra
  #     scheduler service required.
  # To run once (e.g. for testing): docker compose run --rm worker
  worker:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # ── GitHub ────────────────────────────────────────────────────────────────
      GH_TOKEN: ${GH_TOKEN:?set GH_TOKEN in .env}
      GITHUB_OWNER: ${GITHUB_OWNER:?set GITHUB_OWNER in .env}
      TRIGGER_LABEL: ${TRIGGER_LABEL}
      PROCESSING_LABEL: ${PROCESSING_LABEL}
      WAITING_LABEL: ${WAITING_LABEL}
      READY_LABEL: ${READY_LABEL}
      MAX_LOOP_RETRIES: ${MAX_LOOP_RETRIES}

      # ── AI provider ───────────────────────────────────────────────────────────
      # GEMINI_API_TOKEN is optional — only required when OPENCODE_MODEL starts with google/
      GEMINI_API_TOKEN: ${GEMINI_API_TOKEN:-}
      # OLLAMA_HOST points the container at the host machine's Ollama instance.
      # host.docker.internal resolves on Docker Desktop (Mac/Windows) automatically;
      # on Linux it requires the extra_hosts entry below.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OPENCODE_MODEL: ${OPENCODE_MODEL}
      OPENCODE_PLAN_MODEL: ${OPENCODE_PLAN_MODEL:-}
      OPENCODE_EXECUTE_MODEL: ${OPENCODE_EXECUTE_MODEL:-}
      OPENCODE_FALLBACK_MODELS: ${OPENCODE_FALLBACK_MODELS:-}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT}
      PLAN_TIMEOUT: ${PLAN_TIMEOUT:-}

      # ── WordPress test database ───────────────────────────────────────────────
      # WP_DB_HOST is always "mysql" (the service above); not read from .env.
      WP_DB_HOST: mysql
      WP_DB_NAME: ${WP_DB_NAME}
      WP_DB_USER: ${WP_DB_USER}
      WP_DB_PASS: ${WP_DB_PASS}
      WP_VERSION: ${WP_VERSION}
      # WordPress files live in the persistent wp_data volume so they survive
      # container restarts and don't need to be re-downloaded every time.
      # WP_CORE_DIR is read by wp-cli's install-wp-tests.sh; WP_INSTALL_PATH and
      # WP_TESTS_DIR are used by our own hook and verify scripts.
      WP_CORE_DIR: /workspace/wp-data/wordpress
      WP_INSTALL_PATH: /workspace/wp-data/wordpress
      WP_TESTS_DIR: /workspace/wp-data/wordpress-tests-lib

      # ── Base WordPress theme ──────────────────────────────────────────────────
      DT_BASE_THEME_REPO: ${DT_BASE_THEME_REPO}

      # ── E2E verification ──────────────────────────────────────────────────────
      # 02b_prep_e2e_site.sh starts a PHP server inside the container and serves
      # the WordPress test install. WP_TEST_URL points 03_chrome_mcp_e2e.js at it.
      WP_TEST_URL: ${WP_TEST_URL}
      WP_E2E_PORT: ${WP_E2E_PORT}

      # ── Optional: WordPress options secrets ───────────────────────────────────
      # See .env.example for instructions on mounting a secrets file.
      WP_OPTIONS_FILE: ${WP_OPTIONS_FILE}

      # ── Dry-run / testing ────────────────────────────────────────────────────
      # DRY_RUN=true runs all stages but skips git push, gh pr create, and label
      # mutations. Safe for local testing without polluting real issues/PRs.
      DRY_RUN: ${DRY_RUN}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS}

      # ── Timezone ──────────────────────────────────────────────────────────────
      TZ: ${TZ:-UTC}

      # ── Polling interval ──────────────────────────────────────────────────────
      IDLE_SLEEP: ${IDLE_SLEEP}

    # Needed on Linux so host.docker.internal resolves to the host machine's IP.
    # Docker Desktop (Mac/Windows) provides this automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Per-run log files written by core-runner.sh (one file per container run).
      # Browse with: ls -lt logs/ | head  or  tail -f logs/<filename>
      - ./logs:/var/log/loop-engineer
      # Persists the .bootstrap_complete flag so bootstrap hooks only run once.
      - state_data:/workspace/state
      # Persists the WordPress install and test library across container restarts.
      # Without this, WP would be re-downloaded every time the container is recreated.
      - wp_data:/workspace/wp-data
      # Uncomment to mount a WordPress options secrets file:
      # - ${WP_OPTIONS_FILE_HOST_PATH}:/run/secrets/wp-options:ro

volumes:
  mysql_data:
  state_data:
  wp_data:
